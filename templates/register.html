<!DOCTYPE html>
<html>
<head>
    <title>Register - Readora</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0732, #130a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 320px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .auth-box h2 {
            margin-bottom: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            padding: 10px;
            background: #0a062c;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .auth-box button:hover {
            background: #16a34a;
        }

        .auth-box a {
            color: #38bdf8;
            text-decoration: none;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        .auth-box a:hover {
            color: #0ea5e9;
        }

        .error {
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="auth-box">
    <h2>Create Account</h2>

    <!-- Optional error message from Flask -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <a href="/login">Already have an account? Login</a>
</div>

</body>
</html>
